name: Pass 1 staging source snapshot
on:
  push:
    branches:
      - work/pass1-v8-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: capital-source
          path: |
            src/
            package.json
            tsconfig.json
            vite.config.ts
            vitest.config.ts
            scripts/
            ROADMAP_REFONTE_ECONOMIE_PRESTIGE_V2.md
          if-no-files-found: error
