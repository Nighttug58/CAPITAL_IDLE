name: Build main/root site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'assets/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: compile-main-root
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build static site in repository root
        run: npm run build:root
      - name: Commit static site to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build(site): update compiled main/root assets [skip ci]"
            git push origin HEAD:main
          fi
      # Une écriture par GITHUB_TOKEN ne déclenche pas à elle seule Pages.
      # Déclencher explicitement la publication branch/root après le commit.
      - name: Request GitHub Pages branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
