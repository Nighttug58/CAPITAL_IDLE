name: Validate economy refactor (temporary)
on:
  push:
    branches:
      - fix/progressive-economy-market-impact
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Full tests and build
        run: npm run verify:release
      - name: Compile Pages root
        run: npm run build:root
