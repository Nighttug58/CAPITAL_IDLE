name: Verify pass 6 (temporary validation branch)
on:
  push:
    branches: [pass6-collections-v3-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate business tests, UI tests, TypeScript and Vite
        run: npm run verify:release
